<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>榛戦┈鐐硅瘎</title>
  <!-- 寮曞叆鏍峰紡 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/shop-list.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
    .ai-assistant {
      margin: 8px 10px 10px;
      padding: 10px;
      border-radius: 8px;
      background: #fff7f2;
      border: 1px solid #ffd6c2;
    }
    .ai-assistant-title {
      font-weight: bold;
      color: #ff6633;
      margin-bottom: 8px;
    }
    .ai-assistant-row {
      display: flex;
      gap: 8px;
    }
    .ai-assistant-row input {
      flex: 1;
      border: 1px solid #ffd6c2;
      border-radius: 18px;
      padding: 8px 12px;
      outline: none;
    }
    .ai-assistant-row button {
      border: 0;
      border-radius: 18px;
      background: #ff6633;
      color: #fff;
      padding: 0 14px;
    }
    .ai-result {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">{{typeName}}</div>
    <div class="header-search">
      <i class="el-icon-search"></i>
    </div>
  </div>
  <div class="sort-bar">
    <div class="sort-item">
      <el-dropdown trigger="click" @command="handleCommand">
      <span class="el-dropdown-link">
        {{typeName}}<i class="el-icon-arrow-down el-icon--right"></i>
      </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
    <div class="sort-item" @click="sortAndQuery('')">
      璺濈 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('comments')">
      浜烘皵 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('score')">
      璇勫垎 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
  </div>
  <div class="ai-assistant">
    <div class="ai-assistant-title">AI 鐐硅瘎鍔╂墜</div>
    <div class="ai-assistant-row">
      <input v-model="aiQuery" placeholder="Try: hotpot nearby with coupon">
      <button @click="askAiAssistant">AI</button>
    </div>
    <div class="ai-result" v-if="aiResult">{{aiResult}}</div>
  </div>
  <div class="shop-list" @scroll="onScroll">
    <div class="shop-box" v-for="s in shops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img"><img :src="s.images" alt=""></div>
      <div class="shop-info">
        <div class="shop-title shop-item">{{s.name}}</div>
        <div class="shop-rate shop-item" >
          <el-rate
              disabled v-model="s.score/10"
              text-color="#F63"
              show-score
          ></el-rate>
          <span>{{s.comments}}鏉?/span>
        </div>
        <div class="shop-area shop-item">
          <span>{{s.area}}</span>
          <span v-if="s.distance">{{s.distance < 1000 ? s.distance.toFixed(1) + 'm' : (s.distance/1000).toFixed(1) + 'km'}}</span>
        </div>
        <div class="shop-avg shop-item">锟{s.avgPrice}}/浜?/div>
        <div class="shop-address shop-item">
          <i class="el-icon-map-location"></i>
          <span>{{s.address}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 寮曞叆缁勪欢搴?-->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      types: [], // 绫诲瀷鍒楄〃
      shops: [], // 鍟嗗簵鍒楄〃
      typeName: "",
      aiQuery: "",
      aiResult: "",
      params:{
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 120.149993, // 缁忓害
        y: 30.334229 // 绾害
      }
    },
    created() {
      // 鑾峰彇鍙傛暟
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name");
      // 鏌ヨ绫诲瀷
      this.queryTypes();
      // 鏌ヨ鍟嗗簵
      this.queryShops();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      queryShops() {
        axios.get("/shop/of/type", {
            params: this.params
          })
          .then(({data}) => {
            if (!data) {
              return
            }
            data.forEach(s => s.images = s.images.split(',')[0]);
            this.shops = this.shops.concat(data);
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type="+t.id+"&name="+t.name;
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        this.queryShops();
      },
      goBack() {
        history.back();
      },
      toDetail(id) {
        location.href = "/shop-detail.html?id="+id
      },
      askAiAssistant() {
        const query = this.aiQuery || ("鎺ㄨ崘" + this.typeName);
        this.aiResult = "AI 姝ｅ湪鍒嗘瀽...";
        axios.post("/ai/assistant/recommend", {
          query,
          x: this.params.x,
          y: this.params.y,
          currentTypeId: Number(this.params.typeId)
        }).then(({data}) => {
          const shops = data.recommendShops || [];
          if (!shops.length) {
            this.aiResult = data.intentSummary || "No matched recommendation yet";
            return;
          }
          this.aiResult = shops.map((s, i) => {
            return (i + 1) + ". " + s.name + " - " + (s.reason || "Matched current request");
          }).join("\n");
        }).catch(err => this.aiResult = err);
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if(scrollTop + offsetHeight + 1 > scrollHeight && !this.isReachBottom){
          this.isReachBottom = true
          console.log("瑙﹀簳")
          this.params.current++
          this.queryShops(this.params.current, 5);
        }else{
          this.isReachBottom = false
        }
      },
    }
  })
</script>
</body>
</html>
